<div class="js-escopo-painel border rounded p-3 mb-3 bg-light">
    <p class="fw-semibold mb-2">Escopo de Blocos</p>
    <div class="form-check mb-2">
        <input class="form-check-input js-escopo-todos" type="checkbox"
               name="escopo_todos" value="1" id="{{ id_prefix }}-todos"
               {% if escopo_todos %}checked{% endif %}>
        <label class="form-check-label" for="{{ id_prefix }}-todos">
            Todos os Blocos (Síndico Geral)
        </label>
    </div>
    <div class="d-flex flex-wrap gap-3">
        {% for codigo in blocos %}
        <div class="form-check">
            <input class="form-check-input js-escopo-bloco" type="checkbox"
                   name="blocos_escopo" value="{{ codigo }}"
                   id="{{ id_prefix }}-b{{ codigo }}"
                   {% if not escopo_todos and codigo in escopo_codigos %}checked{% endif %}>
            <label class="form-check-label" for="{{ id_prefix }}-b{{ codigo }}">
                Bloco {{ codigo }}
            </label>
        </div>
        {% endfor %}
    </div>
    <p class="form-text mb-0">Um síndico pode cuidar de um bloco, de vários ou de todos.</p>
</div>

<div class="mb-3">
    <p class="fw-semibold mb-2">Permissões Extras</p>
    <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" name="perm_portaria" value="1"
               id="{{ id_prefix }}-portaria" {% if perm_portaria %}checked{% endif %}>
        <label class="form-check-label" for="{{ id_prefix }}-portaria">
            Acessar Portaria e Controle de Acesso Geral
        </label>
    </div>
    <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" name="perm_reservas_geral" value="1"
               id="{{ id_prefix }}-reservas" {% if perm_reservas_geral %}checked{% endif %}>
        <label class="form-check-label" for="{{ id_prefix }}-reservas">
            Gerenciar também espaços gerais do condomínio
        </label>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="checkbox" name="perm_configuracoes" value="1"
               id="{{ id_prefix }}-config" {% if perm_configuracoes %}checked{% endif %}>
        <label class="form-check-label" for="{{ id_prefix }}-config">
            Acessar Configurações e Setores ADM
        </label>
    </div>
    <p class="form-text mb-0">
        Reservas dos espaços do próprio bloco ficam sempre disponíveis.
        As caixas extras liberam Portaria, espaços gerais do condomínio e Configurações.
    </p>
</div>
